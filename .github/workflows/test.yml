name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Sembolik bağlantıları etkinleştir (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Bağımlılıklar
        run: python -m pip install --upgrade pip pytest pillow
      - name: Paylaşılan kopyalar eşit mi?
        run: python betikler/paylasilanlari_esitle.py --denetle
      - name: Bildirimler güncel mi?
        run: python betikler/eklenti_dosyalari_uret.py --denetle
      - name: Statik denetim
        run: python betikler/statik_denetim.py
      - name: Türkçe uyum denetimi (CJK ve Türkçe karakter hataları)
        run: python betikler/turkce_uyum_denetle.py
      - name: Testler
        run: python -m pytest -q

  cikti-dogrulama:
    name: Çıktı doğrulama · EPUBCheck + LibreOffice + mammoth
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      HIKAYE_DOGRULAMA_ZORUNLU: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip pytest
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: EPUBCheck 5.1.0
        run: |
          curl -fsSL -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q /tmp/epubcheck.zip -d /tmp
          echo "EPUBCHECK_JAR=/tmp/epubcheck-5.1.0/epubcheck.jar" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: mammoth 1.11.0 (Kitaptik DOCX'ini bağımsız okumak için)
        run: |
          npm install --prefix /tmp/mammoth --no-audit --no-fund mammoth@1.11.0
          echo "MAMMOTH_NODE_PATH=/tmp/mammoth/node_modules" >> "$GITHUB_ENV"
      - name: Dışa ve içe aktarma testleri (atlanmadan)
        run: python -m pytest -q -rs testler/test_v2_disa_ve_ice_aktarim.py testler/test_v2_uctan_uca.py testler/test_kitaptik.py
