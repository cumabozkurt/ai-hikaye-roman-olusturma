<svg xmlns="http://www.w3.org/2000/svg" width="921" height="380" viewBox="0 0 921 380" role="img" aria-label="Kitaptik yayın paketi">
<rect width="921" height="380" rx="10" fill="#0d1117"/>
<rect width="921" height="32" rx="10" fill="#161b22"/><rect y="22" width="921" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f56"/><circle cx="40" cy="16" r="6" fill="#ffbd2e"/><circle cx="60" cy="16" r="6" fill="#27c93f"/>
<text x="460" y="21" text-anchor="middle" fill="#8b949e" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Kitaptik yayın paketi</text>
<g font-family="'DejaVu Sans Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="14">
<text x="24" y="60" fill="#79c0ff" xml:space="preserve">$ python3 betikler/kitaptik_hazirla.py paket --proje saatcinin-kizi</text>
<text x="24" y="79" fill="#e6edf3" xml:space="preserve">Kitaptik yayın denetimi: Saatçinin Kızı</text>
<text x="24" y="98" fill="#e6edf3" xml:space="preserve">  2 bölüm dosyası → Kitaptik&#x27;te 2 bölüm, 668 kelime (en uzun bölüm 346)</text>
<text x="24" y="117" fill="#e6edf3" xml:space="preserve"></text>
<text x="24" y="136" fill="#e6edf3" xml:space="preserve">· kapak bulunamadı (kapak/kapak.jpg); kapak, okurun listede ilk gördüğü şeydir. Önerilen ölçü 583×827</text>
<text x="24" y="155" fill="#e6edf3" xml:space="preserve">    piksel; /kapak-tasarla becerisine bakın</text>
<text x="24" y="174" fill="#e6edf3" xml:space="preserve"></text>
<text x="24" y="193" fill="#e6edf3" xml:space="preserve">Toplam: 0 hata, 0 uyarı, 1 bilgi.</text>
<text x="24" y="212" fill="#e6edf3" xml:space="preserve"></text>
<text x="24" y="231" fill="#e6edf3" xml:space="preserve">Yazılan dosyalar:</text>
<text x="24" y="250" fill="#e6edf3" xml:space="preserve">  saatcinin-kizi/yayin/kitaptik/saatcinin-kizi-kitaptik.docx</text>
<text x="24" y="269" fill="#e6edf3" xml:space="preserve">  saatcinin-kizi/yayin/kitaptik/kitap-bilgileri.md</text>
<text x="24" y="288" fill="#e6edf3" xml:space="preserve">  saatcinin-kizi/yayin/kitaptik/karakterler.md</text>
<text x="24" y="307" fill="#e6edf3" xml:space="preserve">  saatcinin-kizi/yayin/kitaptik/yayin-kontrol-listesi.md</text>
<text x="24" y="326" fill="#e6edf3" xml:space="preserve">  saatcinin-kizi/yayin/kitaptik/rapor.json</text>
<text x="24" y="345" fill="#e6edf3" xml:space="preserve">Sıradaki adım: yayin-kontrol-listesi.md dosyasını izleyerek Kitaptik&#x27;te yayımlayın.</text>
</g>
</svg>
